<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theo's Bakery</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
</head>
<body>

    <header id="site-header">
        <h1 id="page-title">Sunny Side Bakery</h1>
        <button onclick="toggle()" id="theme-toggle">Earth Day Menu</button>
    </header>

    <main>
        <h2 id="welcome-heading">Welcome!</h2>
        <p id="welcome-text">Fresh bread, cookies, and pies baked every morning. Stop by and say hi!</p>

        <div id="menu-box">
            <h2 id="menu">Today's Menu</h2>
            <ul>
                <li id="1">Chocolate Chip Cookies</li>
                <li id="2">Cinnamon Rolls</li>
                <li id="3">Apple Pie</li>
                <li id="4">Sourdough Bread</li>
            </ul>
        </div>
    </main>

    <footer id="site-footer">
        <p>Open every day, 7am - 3pm</p>
    </footer>
</body>
</html>
